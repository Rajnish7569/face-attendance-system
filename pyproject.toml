[project]
name = "face-attendance-system"
version = "0.1.0"
description = "A simple application to recognise faces and check for attendance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.2.1",
    "dlib>=20.0.0",
    "face-recognition>=1.3.0",
    "face-recognition-models",
    "numpy>=2.3.1",
    "opencv-python>=4.11.0.86",
    "pillow>=11.3.0",
    "setuptools>=80.9.0",
]

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }
